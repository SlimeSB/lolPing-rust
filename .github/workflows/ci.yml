name: macOS check

# The macOS-only code can't be built on the development machine, so this compiles the whole crate for it.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets --target aarch64-apple-darwin
