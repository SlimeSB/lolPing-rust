name: Release

# Push a tag that matches Cargo.toml's version (for example v0.5.2) to build both packages and publish them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 builds against glibc 2.35, so the binary still starts on older distributions.
          - runner: ubuntu-22.04
            suffix: linux-x86_64.tar.gz
          - runner: windows-latest
            suffix: win64.zip
          - runner: macos-14
            suffix: arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Read the version, and check it against the tag
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Cargo.toml says $version, the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # GTK draws the tray icon, and the crates in Cargo.toml link against the rest.
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxkbcommon-dev libasound2-dev
      - run: cargo build --locked --release
      # The app reads its icons, sounds and emotes from the assets folder beside the exe, so the two ship together.
      - name: Package the exe with its assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/lolPing.exe, assets -DestinationPath "lolPing-$env:VERSION-${{ matrix.suffix }}"
      - name: Package the binary with its assets
        if: runner.os == 'Linux'
        run: tar -czf "lolPing-$VERSION-${{ matrix.suffix }}" -C target/release lolPing -C "$GITHUB_WORKSPACE" assets
      - name: Package the app with its assets
        if: runner.os == 'macOS'
        run: |
          VERSION="$VERSION" sh packaging/mac/bundle.sh
          codesign --verify --strict target/release/lolPing.app
          tar -czf "lolPing-$VERSION-${{ matrix.suffix }}" -C target/release lolPing.app
      - uses: actions/upload-artifact@v4
        with:
          name: lolPing-${{ matrix.suffix }}
          path: lolPing-*
          if-no-files-found: error
  release:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag like v0.5.3-beta.2 is a tester build, so it goes out as a pre-release instead of the latest one.
          prerelease=$(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "lolPing ${GITHUB_REF_NAME#v}" --generate-notes $prerelease lolPing-*
