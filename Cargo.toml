[package]
name = "lolping"
version = "0.5.1"
edition = "2021"
description = "League of Legends style ping wheel for your Windows desktop"
license = "MIT"
repository = "https://github.com/SlimeSB/lolPing-rust"

[[bin]]
name = "lolPing"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[lints.clippy]
too_many_arguments = "allow"

[dependencies]
ab_glyph = "0.2.32"
eframe = { version = "0.36.2", features = ["wgpu"] }
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "webp", "jpeg", "gif"] }
parking_lot = "0.12.5"
rfd = "0.17.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav", "vorbis"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
tiny-skia = "0.12.0"
tray-icon = "0.26.1"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
scrypt = "0.12.0"
hkdf = "0.13.0"
aes-gcm = "0.11.1"
base64 = "0.23.1"
k256 = { version = "0.14.0", features = ["schnorr"] }
getrandom = "0.4.3"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
ogg = "0.9.2"
opus-rs = "0.1.37"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_Globalization", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", default-features = false, features = ["allow-unsafe-code", "xtest", "shape", "randr", "shm"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"
